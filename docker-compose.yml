version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: bookstore_postgres
    environment:
      POSTGRES_DB: BOOKSTORE_DB
      POSTGRES_USER: post_user
      POSTGRES_PASSWORD: post_password
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - bookstore-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U post_user -d BOOKSTORE_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

networks:
  bookstore-network:
    driver: bridge