spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/BOOKSTORE_DB
    username: post_user
    password: post_password
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true